<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>大人かわいいカロリーRec</title>
  <style>
    :root {
      --bg-color: #fcf9f9;
      --card-bg: #ffffff;
      --accent: #e88d9d;
      --text: #4a4243;
      --sub-text: #8c8283;
      --border: #f0e6e7;
    }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: var(--bg-color);
      color: var(--text);
      max-width: 480px;
      margin: 0 auto;
      padding: 16px;
    }
    .card {
      background: var(--card-bg);
      border-radius: 16px;
      padding: 16px;
      box-shadow: 0 4px 12px rgba(232, 141, 157, 0.08);
      margin-bottom: 16px;
      border: 1px solid getCssVar('--border');
    }
    h1 { font-size: 18px; color: var(--accent); margin-bottom: 12px; }
    .summary { display: flex; justify-content: space-around; text-align: center; }
    .val { font-size: 20px; font-weight: bold; }
    .form-group { display: flex; gap: 8px; margin-top: 12px; }
    input, select, button { padding: 8px 12px; border-radius: 20px; border: 1px solid getCssVar('--border'); }
    button { background: var(--accent); color: white; border: none; cursor: pointer; }
    .meal-item { display: flex; justify-content: space-between; padding: 8px 0; border-bottom: 1px solid getCssVar('--border'); }
  </style>
</head>
<body>
  <div class="card">
    <h1>♡ 大人かわいい カロリーRec</h1>
    <div class="summary">
      <div><div>目標</div><div class="val">1,650</div></div>
      <div><div>本日</div><div class="val" id="today-val">0</div></div>
    </div>
    <div class="form-group">
      <input type="text" id="name" placeholder="食べたもの" style="flex:1;">
      <input type="number" id="cal" placeholder="kcal" style="width:70px;">
      <button onclick="add()">追加</button>
    </div>
  </div>
  <div class="card">
    <h3>本日の食事記録</h3>
    <div id="list"></div>
  </div>
  <script>
    let logs = JSON.parse(localStorage.getItem('cal_logs') || '[]');
    function render() {
      const list = document.getElementById('list');
      if (list) list.innerHTML = '';
      let sum = 0;
      logs.forEach((item, idx) => {
        sum += item.cal;
        list.innerHTML += `<div class="meal-item"><span>${item.name}</span><span>${item.cal} kcal <button onclick="del(${idx})">×</button></span></div>`;
      });
      document.getElementById('today-val').textContent = sum;
      localStorage.setItem('cal_logs', JSON.stringify(logs));
    }
    function add() {
      const name = document.getElementById('name').value;
      const cal = parseInt(document.getElementById('cal').value);
      if(name && cal) { logs.push({name, cal}); render(); document.getElementById('name').value=''; document.getElementById('cal').value=''; }
    }
    function del(idx) { logs.splice(idx,1); render(); }
    render();
  </script>
</body>
</html>
