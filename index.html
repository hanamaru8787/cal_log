<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>カロリー管理</title>
  <style>
    :root {
      --bg-color: #fcf8f6;
      --card-bg: #ffffff;
      --primary: #e07a5f;
      --primary-light: #f4f1de;
      --secondary: #81b29a;
      --text: #3d405b;
      --text-muted: #8d99ae;
      --border: #f0e6df;
      --danger: #e63946;
      --warning: #f4a261;
      --shadow: 0 4px 15px rgba(0, 0, 0, 0.05);
      --radius: 16px;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      background-color: var(--bg-color);
      color: var(--text);
      line-height: 1.5;
      padding-bottom: 80px;
    }

    .container {
      max-width: 480px;
      margin: 0 auto;
      padding: 16px;
    }

    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 20px;
      padding: 8px 0;
    }

    h1 {
      font-size: 1.25rem;
      font-weight: 700;
      color: var(--primary);
    }

    .card {
      background: var(--card-bg);
      border-radius: var(--radius);
      padding: 20px;
      margin-bottom: 16px;
      box-shadow: var(--shadow);
      border: 1px solid var(--border);
    }

    .date-selector {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 16px;
      background: var(--card-bg);
      padding: 12px 16px;
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      border: 1px solid var(--border);
    }

    .date-selector input[type="date"] {
      border: none;
      background: transparent;
      font-size: 1rem;
      font-weight: 600;
      color: var(--text);
      outline: none;
    }

    .nav-tabs {
      display: flex;
      position: fixed;
      bottom: 0;
      left: 50%;
      transform: translateX(-50%);
      width: 100%;
      max-width: 480px;
      background: var(--card-bg);
      border-top: 1px solid var(--border);
      box-shadow: 0 -4px 15px rgba(0, 0, 0, 0.05);
      z-index: 100;
    }

    .tab-btn {
      flex: 1;
      padding: 12px 0;
      border: none;
      background: none;
      font-size: 0.75rem;
      color: var(--text-muted);
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 4px;
      cursor: pointer;
    }

    .tab-btn.active {
      color: var(--primary);
      font-weight: bold;
    }

    .tab-btn span {
      font-size: 1.2rem;
    }

    .tab-content {
      display: none;
    }

    .tab-content.active {
      display: block;
    }

    /* Summary Dashboard */
    .summary-box {
      text-align: center;
      padding: 10px 0;
    }

    .calorie-display {
      font-size: 2.2rem;
      font-weight: 800;
      color: var(--primary);
      margin: 8px 0;
    }

    .status-badge {
      display: inline-block;
      padding: 6px 16px;
      border-radius: 20px;
      background-color: var(--primary-light);
      font-weight: 600;
      font-size: 0.95rem;
      margin-top: 4px;
    }

    .stats-row {
      display: flex;
      justify-content: space-between;
      margin-top: 16px;
      padding-top: 16px;
      border-top: 1px dashed var(--border);
      font-size: 0.9rem;
    }

    /* Meals Section */
    .meal-section {
      margin-bottom: 16px;
    }

    .meal-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 8px;
    }

    .meal-title {
      font-weight: 700;
      font-size: 1rem;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .add-food-btn {
      background: var(--primary-light);
      color: var(--primary);
      border: none;
      padding: 4px 12px;
      border-radius: 12px;
      font-size: 0.8rem;
      font-weight: 600;
      cursor: pointer;
    }

    .food-list {
      list-style: none;
    }

    .food-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 8px 0;
      border-bottom: 1px dotted var(--border);
      font-size: 0.9rem;
    }

    .food-item:last-child {
      border-bottom: none;
    }

    .delete-item-btn {
      color: var(--text-muted);
      border: none;
      background: none;
      font-size: 1rem;
      margin-left: 8px;
      cursor: pointer;
    }

    /* Modal / Form Styling */
    .modal {
      display: none;
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0, 0, 0, 0.4);
      z-index: 200;
      align-items: center;
      justify-content: center;
    }

    .modal.active {
      display: flex;
    }

    .modal-content {
      background: var(--card-bg);
      width: 90%;
      max-width: 400px;
      border-radius: var(--radius);
      padding: 20px;
      box-shadow: var(--shadow);
    }

    .modal-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 16px;
    }

    .close-btn {
      background: none;
      border: none;
      font-size: 1.2rem;
      color: var(--text-muted);
      cursor: pointer;
    }

    .form-group {
      margin-bottom: 16px;
    }

    .form-group label {
      display: block;
      font-size: 0.85rem;
      margin-bottom: 6px;
      color: var(--text-muted);
    }

    .form-control {
      width: 100%;
      padding: 10px;
      border: 1px solid var(--border);
      border-radius: 8px;
      font-size: 1rem;
      outline: none;
    }

    .btn {
      width: 100%;
      padding: 12px;
      border: none;
      border-radius: 8px;
      background: var(--primary);
      color: white;
      font-weight: 700;
      font-size: 1rem;
      cursor: pointer;
    }

    /* Master Section */
    .master-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 12px 0;
      border-bottom: 1px solid var(--border);
    }

    .master-actions button {
      background: none;
      border: none;
      margin-left: 8px;
      font-size: 0.9rem;
      cursor: pointer;
    }

    /* Rates Cards */
    .rate-card {
      text-align: center;
      padding: 16px;
    }

    .rate-val {
      font-size: 1.8rem;
      font-weight: 700;
      color: var(--secondary);
      margin: 4px 0;
    }

    .rate-sub {
      font-size: 0.8rem;
      color: var(--text-muted);
    }
  </style>
</head>
<body>

  <div class="container">
    <header>
      <h1>カロリー管理</h1>
    </header>

    <!-- Tab 1: Daily Log -->
    <div id="tab-log" class="tab-content active">
      <div class="date-selector">
        <label for="current-date" style="font-weight:600;">日付</label>
        <input type="date" id="current-date">
      </div>

      <div class="card summary-box">
        <div style="font-size: 0.85rem; color: var(--text-muted);">本日の残りカロリー</div>
        <div class="calorie-display" id="remaining-calories">-- kcal</div>
        <div>
          <span class="status-badge" id="status-badge">--</span>
        </div>
        <div class="stats-row">
          <div>目標: <span id="disp-target">1250</span> kcal</div>
          <div>摂取: <span id="disp-consumed">0</span> kcal</div>
        </div>
      </div>

      <!-- Meals -->
      <div id="meals-container"></div>
    </div>

    <!-- Tab 2: Rates / Analytics -->
    <div id="tab-rates" class="tab-content">
      <div class="card rate-card">
        <h3>直近7日間</h3>
        <div class="rate-val" id="rate-7d">0%</div>
        <div class="rate-sub" id="sub-7d">目標達成：0日 / 記録日数 0日</div>
      </div>

      <div class="card rate-card">
        <h3>今月</h3>
        <div class="rate-val" id="rate-month">0%</div>
        <div class="rate-sub" id="sub-month">目標達成：0日 / 記録日数 0日</div>
      </div>
    </div>

    <!-- Tab 3: Food Master -->
    <div id="tab-master" class="tab-content">
      <div style="margin-bottom: 16px; text-align: right;">
        <button class="add-food-btn" style="padding: 8px 16px; font-size: 0.9rem;" onclick="openMasterModal()">+ 新しい食品を登録</button>
      </div>
      <div class="card">
        <h3 style="margin-bottom: 12px; font-size: 1rem;">登録済み食品一覧</h3>
        <div id="master-list"></div>
      </div>
    </div>

    <!-- Tab 4: Settings -->
    <div id="tab-settings" class="tab-content">
      <div class="card">
        <h3 style="margin-bottom: 16px; font-size: 1rem;">目標カロリー設定</h3>
        <div class="form-group">
          <label for="target-input">1日の目標カロリー (kcal)</label>
          <input type="number" id="target-input" class="form-control">
        </div>
        <button class="btn" onclick="saveTargetCalorie()">保存する</button>
      </div>
    </div>
  </div>

  <!-- Bottom Nav -->
  <nav class="nav-tabs">
    <button class="tab-btn active" onclick="switchTab('log')">
      <span>📖</span>記録
    </button>
    <button class="tab-btn" onclick="switchTab('rates')">
      <span>📊</span>達成率
    </button>
    <button class="tab-btn" onclick="switchTab('master')">
      <span>🍎</span>食品マスタ
    </button>
    <button class="tab-btn" onclick="switchTab('settings')">
      <span>⚙️</span>設定
    </button>
  </nav>

  <!-- Add Meal Item Modal -->
  <div class="modal" id="add-meal-modal">
    <div class="modal-content">
      <div class="modal-header">
        <h3 id="modal-meal-title">食品を追加</h3>
        <button class="close-btn" onclick="closeModal('add-meal-modal')">✕</button>
      </div>
      <div class="form-group">
        <label>食品マスタから選択</label>
        <select id="master-select" class="form-control" onchange="onSelectMasterFood(this)">
          <option value="">-- 選択してください --</option>
        </select>
      </div>
      <div class="form-group">
        <label>食品名</label>
        <input type="text" id="meal-food-name" class="form-control" placeholder="例: 鮭のおにぎり">
      </div>
      <div class="form-group">
        <label>カロリー (kcal)</label>
        <input type="number" id="meal-food-cal" class="form-control" placeholder="例: 180">
      </div>
      <button class="btn" onclick="saveMealItem()">登録する</button>
    </div>
  </div>

  <!-- Master Food Modal -->
  <div class="modal" id="master-modal">
    <div class="modal-content">
      <div class="modal-header">
        <h3 id="master-modal-title">食品マスタ登録</h3>
        <button class="close-btn" onclick="closeModal('master-modal')">✕</button>
      </div>
      <input type="hidden" id="master-edit-id">
      <div class="form-group">
        <label>食品名</label>
        <input type="text" id="master-food-name" class="form-control">
      </div>
      <div class="form-group">
        <label>カロリー (kcal)</label>
        <input type="number" id="master-food-cal" class="form-control">
      </div>
      <button class="btn" onclick="saveMasterFood()">保存する</button>
    </div>
  </div>

  <script>
    // State Management
    const MEAL_TYPES = ['朝', '昼', '間食', '夜'];
    
    function getLocalDateString(d = new Date()) {
      const year = d.getFullYear();
      const month = String(d.getMonth() + 1).padStart(2, '0');
      const day = String(d.getDate()).padStart(2, '0');
      return `${year}-${month}-${day}`;
    }

    let state = {
      targetCalorie: 1250,
      currentDate: getLocalDateString(),
      records: {}, // { 'YYYY-MM-DD': { '朝': [{ id, name, cal }], ... } }
      master: []  // [{ id, name, cal }]
    };

    let activeMealType = '';

    // Storage Keys
    const STORAGE_KEY = 'calorie_app_data_v1';

    function loadData() {
      const saved = localStorage.getItem(STORAGE_KEY);
      if (saved) {
        try {
          const parsed = JSON.parse(saved);
          state.targetCalorie = parsed.targetCalorie ?? 1250;
          state.records = parsed.records || {};
          state.master = parsed.master || [];
        } catch (e) {
          console.error(e);
        }
      }
    }

    function saveData() {
      localStorage.setItem(STORAGE_KEY, JSON.stringify({
        targetCalorie: state.targetCalorie,
        records: state.records,
        master: state.master
      }));
    }

    // Initialize App
    window.addEventListener('DOMContentLoaded', () => {
      loadData();
      document.getElementById('current-date').value = state.currentDate;
      document.getElementById('target-input').value = state.targetCalorie;

      document.getElementById('current-date').addEventListener('change', (e) => {
        state.currentDate = e.target.value;
        renderLogTab();
      });

      renderLogTab();
    });

    // Navigation
    function switchTab(tabName) {
      document.querySelectorAll('.tab-content').forEach(el => el.classList.remove('active'));
      document.querySelectorAll('.tab-btn').forEach(el => el.classList.remove('active'));

      document.getElementById(`tab-${tabName}`).classList.add('active');
      event.currentTarget.classList.add('active');

      if (tabName === 'log') renderLogTab();
      if (tabName === 'rates') renderRatesTab();
      if (tabName === 'master') renderMasterTab();
      if (tabName === 'settings') {
        document.getElementById('target-input').value = state.targetCalorie;
      }
    }

    // Render Log Tab
    function renderLogTab() {
      const dateKey = state.currentDate;
      if (!state.records[dateKey]) {
        state.records[dateKey] = { '朝': [], '昼': [], '間食': [], '夜': [] };
      }
      const dayRecord = state.records[dateKey];

      // Calculate total
      let totalCal = 0;
      MEAL_TYPES.forEach(type => {
        if (dayRecord[type]) {
          dayRecord[type].forEach(item => totalCal += Number(item.cal || 0));
        }
      });

      // Update Summary
      const target = Number(state.targetCalorie);
      const remaining = target - totalCal;

      const remainingEl = document.getElementById('remaining-calories');
      if (remaining >= 0) {
        remainingEl.textContent = `残り ${remaining.toLocaleString()} kcal`;
      } else {
        remainingEl.textContent = `${Math.abs(remaining).toLocaleString()} kcalオーバー`;
      }

      document.getElementById('disp-target').textContent = target.toLocaleString();
      document.getElementById('disp-consumed').textContent = totalCal.toLocaleString();

      // Status Badge
      const ratio = target > 0 ? (totalCal / target) * 100 : 0;
      const statusEl = document.getElementById('status-badge');

      if (ratio < 80) {
        statusEl.textContent = '余裕🙂';
      } else if (ratio <= 100) {
        statusEl.textContent = 'ふつう😌';
      } else if (ratio <= 110) {
        statusEl.textContent = 'キケン😖';
      } else {
        statusEl.textContent = 'アウト😵';
      }

      // Render Meals List
      const container = document.getElementById('meals-container');
      container.innerHTML = '';

      MEAL_TYPES.forEach(type => {
        const items = dayRecord[type] || [];
        const card = document.createElement('div');
        card.className = 'card meal-section';

        let itemsHtml = '';
        if (items.length === 0) {
          itemsHtml = '<div style="color:var(--text-muted); font-size:0.85rem; padding: 4px 0;">記録はありません</div>';
        } else {
          itemsHtml = '<ul class="food-list">' + items.map((item, idx) => `
            <li class="food-item">
              <span>${escapeHtml(item.name)}</span>
              <div>
                <span style="font-weight:600;">${Number(item.cal).toLocaleString()} kcal</span>
                <button class="delete-item-btn" onclick="deleteMealItem('${type}', ${idx})">✕</button>
              </div>
            </li>
          `).join('') + '</ul>';
        }

        card.innerHTML = `
          <div class="meal-header">
            <div class="meal-title">${type}</div>
            <button class="add-food-btn" onclick="openAddMealModal('${type}')">+ 追加</button>
          </div>
          ${itemsHtml}
        `;
        container.appendChild(card);
      });
    }

    // Modal Control
    function openModal(id) {
      document.getElementById(id).classList.add('active');
    }
    function closeModal(id) {
      document.getElementById(id).classList.remove('active');
    }

    // Add Meal
    function openAddMealModal(type) {
      activeMealType = type;
      document.getElementById('modal-meal-title').textContent = `${type}に食品を追加`;
      document.getElementById('meal-food-name').value = '';
      document.getElementById('meal-food-cal').value = '';

      // Populate Master Select
      const select = document.getElementById('master-select');
      select.innerHTML = '<option value="">-- 選択してください --</option>';
      state.master.forEach(m => {
        const opt = document.createElement('option');
        opt.value = m.id;
        opt.textContent = `${m.name} (${m.cal} kcal)`;
        select.appendChild(opt);
      });

      openModal('add-meal-modal');
    }

    function onSelectMasterFood(selectEl) {
      const id = selectEl.value;
      if (!id) return;
      const item = state.master.find(m => m.id === id);
      if (item) {
        document.getElementById('meal-food-name').value = item.name;
        document.getElementById('meal-food-cal').value = item.cal;
      }
    }

    function saveMealItem() {
      const name = document.getElementById('meal-food-name').value.trim();
      const cal = document.getElementById('meal-food-cal').value;

      if (!name || cal === '') {
        alert('食品名とカロリーを入力してください。');
        return;
      }

      const dateKey = state.currentDate;
      if (!state.records[dateKey]) {
        state.records[dateKey] = { '朝': [], '昼': [], '間食': [], '夜': [] };
      }

      state.records[dateKey][activeMealType].push({
        id: Date.now().toString(),
        name: name,
        cal: Number(cal)
      });

      saveData();
      closeModal('add-meal-modal');
      renderLogTab();
    }

    function deleteMealItem(type, index) {
      const dateKey = state.currentDate;
      if (state.records[dateKey] && state.records[dateKey][type]) {
        state.records[dateKey][type].splice(index, 1);
        saveData();
        renderLogTab();
      }
    }

    // Master Tab Operations
    function renderMasterTab() {
      const listEl = document.getElementById('master-list');
      if (state.master.length === 0) {
        listEl.innerHTML = '<div style="color:var(--text-muted); font-size:0.9rem;">登録された食品はありません</div>';
        return;
      }

      listEl.innerHTML = state.master.map(m => `
        <div class="master-item">
          <div>
            <div style="font-weight:600;">${escapeHtml(m.name)}</div>
            <div style="font-size:0.85rem; color:var(--text-muted);">${Number(m.cal).toLocaleString()} kcal</div>
          </div>
          <div class="master-actions">
            <button style="color:var(--primary);" onclick="openMasterModal('${m.id}')">編集</button>
            <button style="color:var(--danger);" onclick="deleteMasterFood('${m.id}')">削除</button>
          </div>
        </div>
      `).join('');
    }

    function openMasterModal(id = null) {
      document.getElementById('master-edit-id').value = id || '';
      if (id) {
        const item = state.master.find(m => m.id === id);
        if (item) {
          document.getElementById('master-modal-title').textContent = '食品マスタ編集';
          document.getElementById('master-food-name').value = item.name;
          document.getElementById('master-food-cal').value = item.cal;
        }
      } else {
        document.getElementById('master-modal-title').textContent = '食品マスタ登録';
        document.getElementById('master-food-name').value = '';
        document.getElementById('master-food-cal').value = '';
      }
      openModal('master-modal');
    }

    function saveMasterFood() {
      const id = document.getElementById('master-edit-id').value;
      const name = document.getElementById('master-food-name').value.trim();
      const cal = document.getElementById('master-food-cal').value;

      if (!name || cal === '') {
        alert('食品名とカロリーを入力してください。');
        return;
      }

      if (id) {
        const item = state.master.find(m => m.id === id);
        if (item) {
          item.name = name;
          item.cal = Number(cal);
        }
      } else {
        state.master.push({
          id: Date.now().toString(),
          name: name,
          cal: Number(cal)
        });
      }

      saveData();
      closeModal('master-modal');
      renderMasterTab();
    }

    function deleteMasterFood(id) {
      if (confirm('この食品マスタを削除しますか？')) {
        state.master = state.master.filter(m => m.id !== id);
        saveData();
        renderMasterTab();
      }
    }

    // Settings Tab Operations
    function saveTargetCalorie() {
      const val = document.getElementById('target-input').value;
      if (val === '') {
        alert('目標カロリーを入力してください。');
        return;
      }

      state.targetCalorie = Number(val);
      saveData();
      alert('目標カロリーを変更しました。');
      renderLogTab();
    }

    // Analytics / Rates Tab Operations
    function renderRatesTab() {
      const target = Number(state.targetCalorie);

      // Get list of recorded dates with at least 1 item
      const recordedDates = Object.keys(state.records).filter(dateKey => {
        const rec = state.records[dateKey];
        let count = 0;
        MEAL_TYPES.forEach(t => {
          if (rec[t] && rec[t].length > 0) count += rec[t].length;
        });
        return count > 0;
      });

      // Local Date calculation
      const today = new Date();
      
      // Calculate 7 Days
      const last7DaysStr = [];
      for (let i = 0; i < 7; i++) {
        const d = new Date(today.getFullYear(), today.getMonth(), today.getDate() - i);
        last7DaysStr.push(getLocalDateString(d));
      }

      // Calculate Current Month
      const currentYear = today.getFullYear();
      const currentMonth = today.getMonth();

      // Filter recorded dates
      const valid7Days = recordedDates.filter(d => last7DaysStr.includes(d));
      const validMonthDays = recordedDates.filter(d => {
        const parts = d.split('-');
        return Number(parts[0]) === currentYear && (Number(parts[1]) - 1) === currentMonth;
      });

      function calcStats(dates) {
        const totalRecorded = dates.length;
        if (totalRecorded === 0) {
          return { rate: 0, achieved: 0, total: 0 };
        }

        let achieved = 0;
        dates.forEach(d => {
          const rec = state.records[d];
          let dayCal = 0;
          MEAL_TYPES.forEach(t => {
            if (rec[t]) {
              rec[t].forEach(item => dayCal += Number(item.cal || 0));
            }
          });
          if (dayCal <= target) {
            achieved++;
          }
        });

        const rate = Math.round((achieved / totalRecorded) * 100);
        return { rate, achieved, total: totalRecorded };
      }

      const stats7d = calcStats(valid7Days);
      const statsMonth = calcStats(validMonthDays);

      document.getElementById('rate-7d').textContent = `${stats7d.rate}%`;
      document.getElementById('sub-7d').textContent = `目標達成：${stats7d.achieved}日 / 記録日数 ${stats7d.total}日`;

      document.getElementById('rate-month').textContent = `${statsMonth.rate}%`;
      document.getElementById('sub-month').textContent = `目標達成：${statsMonth.achieved}日 / 記録日数 ${statsMonth.total}日`;
    }

    // Utility
    function escapeHtml(str) {
      return String(str)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#039;');
    }
  </script>
</body>
